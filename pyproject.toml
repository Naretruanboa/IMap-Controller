[project]
name = "pokemon-go-controller"
version = "2.10.0"
description = "Pokemon GO Controller with AI Vision, PokéStop Auto-Spin & Native Auto-Catch Engine"
authors = [{ name = "Naret" }]
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
